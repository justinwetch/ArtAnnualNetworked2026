<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Dynamic — Minter Network</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            image-rendering: auto;
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <script>
        (() => {
            /* ── Config ─────────────────────────────────────────── */
            const NODE_COUNT = 24;
            const IMG_DRAW_SIZE = 96;            // rendered size of each ART icon (at 1080-scale)
            const CONNECT_DIST = 450;           // max distance to draw a line (at 1080-scale)
            const LABEL_GAP = 6;
            const LINE_ALPHA = 0.7;
            const LINE_COLOR = 'rgba(255,255,255,';
            const DYNAMIC_OPACITY = 0.9;        // 90% opacity for the dynamic layer
            const BLEND_MODE = 'screen';

            /* ── Canvas + contexts ─────────────────────────────── */
            const cvs = document.getElementById('c');
            const ctx = cvs.getContext('2d');
            const dpr = window.devicePixelRatio || 1;

            // Offscreen canvas for dynamic layer (nodes/lines)
            const offCvs = document.createElement('canvas');
            const offCtx = offCvs.getContext('2d');

            /* ── Load images ───────────────────────────────────── */
            const canvasImg = new Image();    // background photo
            const maskImg = new Image();      // mask (white = show, black = hide)
            const artImg = new Image();       // ART icon

            function loadImg(img, src) {
                return new Promise((resolve, reject) => {
                    img.onload = () => resolve(img);
                    img.onerror = () => reject(new Error('Failed to load: ' + src));
                    img.src = src;
                });
            }

            Promise.all([
                loadImg(canvasImg, 'Canvas.jpg'),
                loadImg(maskImg, 'Canvas_mask.jpg'),
                loadImg(artImg, 'ART256.png')
            ]).then(init).catch(err => {
                // Show error visibly on the canvas
                cvs.width = 800; cvs.height = 200;
                cvs.style.width = '800px'; cvs.style.height = '200px';
                ctx.fillStyle = '#fff';
                ctx.font = '20px monospace';
                ctx.fillText(err.message, 20, 40);
                ctx.fillText('Make sure image files are in the same folder as index.html', 20, 80);
                console.error(err);
            });

            /* ── Mask bounding-box detection ───────────────────── */
            // Returns { x, y, w, h } normalized 0-1 for the white region in the mask
            function detectMaskBounds(img) {
                const tc = document.createElement('canvas');
                tc.width = img.naturalWidth;
                tc.height = img.naturalHeight;
                const tctx = tc.getContext('2d');
                tctx.drawImage(img, 0, 0);
                const data = tctx.getImageData(0, 0, tc.width, tc.height).data;

                let minX = tc.width, minY = tc.height, maxX = 0, maxY = 0;
                const threshold = 128;

                for (let y = 0; y < tc.height; y++) {
                    for (let x = 0; x < tc.width; x++) {
                        const i = (y * tc.width + x) * 4;
                        // Check if pixel is "white enough"
                        if (data[i] > threshold && data[i + 1] > threshold && data[i + 2] > threshold) {
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                        }
                    }
                }

                return {
                    x: minX / tc.width,
                    y: minY / tc.height,
                    w: (maxX - minX) / tc.width,
                    h: (maxY - minY) / tc.height
                };
            }

            /* ── Nodes ──────────────────────────────────────────── */
            const nodes = [];
            function rand(lo, hi) { return lo + Math.random() * (hi - lo); }

            /* ── Sizing ────────────────────────────────────────── */
            let aspectRatio = 1;     // width / height of Canvas.jpg
            let maskBounds = null;   // normalized mask region
            let REF_W = 1080;       // reference width for scale calculations

            function resize() {
                const ar = aspectRatio;
                const maxW = window.innerWidth;
                const maxH = window.innerHeight;

                let dispW, dispH;
                if (maxW / maxH > ar) {
                    // window is wider than image — fit to height
                    dispH = maxH;
                    dispW = maxH * ar;
                } else {
                    // window is taller — fit to width
                    dispW = maxW;
                    dispH = maxW / ar;
                }

                cvs.style.width = dispW + 'px';
                cvs.style.height = dispH + 'px';
                cvs.width = Math.round(dispW * dpr);
                cvs.height = Math.round(dispH * dpr);

                offCvs.width = cvs.width;
                offCvs.height = cvs.height;
            }

            /* ── Init (called once all images are loaded) ──────── */
            function init() {
                aspectRatio = canvasImg.naturalWidth / canvasImg.naturalHeight;
                maskBounds = detectMaskBounds(maskImg);
                REF_W = canvasImg.naturalWidth;

                // Padding inside mask bounds (normalized, relative to mask region)
                const PAD_NORM = 0.06;

                for (let i = 0; i < NODE_COUNT; i++) {
                    nodes.push({
                        label: `minter ${i + 1}`,
                        // home position normalized within mask bounds
                        hx: maskBounds.x + maskBounds.w * rand(PAD_NORM, 1 - PAD_NORM),
                        hy: maskBounds.y + maskBounds.h * rand(PAD_NORM, 1 - PAD_NORM),
                        // floating parameters
                        ampX: rand(6, 40),
                        ampY: rand(6, 40),
                        freqX: rand(0.15, 1.35),
                        freqY: rand(0.15, 1.35),
                        phaseX: rand(0, Math.PI * 2),
                        phaseY: rand(0, Math.PI * 2),
                        x: 0, y: 0
                    });
                }

                resize();
                window.addEventListener('resize', resize);
                requestAnimationFrame(frame);
            }

            /* ── Draw helpers ───────────────────────────────────── */
            function drawLine(targetCtx, ax, ay, bx, by, alpha, lineW) {
                targetCtx.strokeStyle = LINE_COLOR + alpha.toFixed(3) + ')';
                targetCtx.lineWidth = lineW;
                targetCtx.beginPath();
                targetCtx.moveTo(ax, ay);
                targetCtx.lineTo(bx, by);
                targetCtx.stroke();
            }

            /* ── Main loop ──────────────────────────────────────── */
            let t0 = null;

            function frame(ts) {
                if (!t0) t0 = ts;
                const t = (ts - t0) / 1000;

                const w = cvs.width;
                const h = cvs.height;
                const s = w / REF_W;  // scale factor

                /* ── Layer 1: Draw Canvas.jpg as base ──────────── */
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
                ctx.drawImage(canvasImg, 0, 0, w, h);

                /* ── Layer 2: Draw dynamic artwork on offscreen ── */
                offCtx.clearRect(0, 0, w, h);
                offCtx.globalCompositeOperation = 'source-over';
                offCtx.globalAlpha = 1;

                // Update node positions
                for (const n of nodes) {
                    n.x = n.hx * w + Math.sin(t * n.freqX + n.phaseX) * n.ampX * s;
                    n.y = n.hy * h + Math.sin(t * n.freqY + n.phaseY) * n.ampY * s;
                }

                // Draw connections
                const maxDist = CONNECT_DIST * s;
                for (let i = 0; i < NODE_COUNT; i++) {
                    for (let j = i + 1; j < NODE_COUNT; j++) {
                        const dx = nodes[j].x - nodes[i].x;
                        const dy = nodes[j].y - nodes[i].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < maxDist) {
                            const alpha = LINE_ALPHA * (1 - dist / maxDist);
                            drawLine(offCtx, nodes[i].x, nodes[i].y, nodes[j].x, nodes[j].y, alpha, 2.5 * dpr);
                        }
                    }
                }

                // Draw nodes
                const iw = IMG_DRAW_SIZE * s;
                offCtx.font = `600 ${Math.round(22 * s)}px "Inter", "Segoe UI", system-ui, sans-serif`;
                offCtx.textAlign = 'center';
                offCtx.textBaseline = 'top';

                for (const n of nodes) {
                    if (artImg.complete && artImg.naturalWidth > 0) {
                        offCtx.drawImage(artImg, n.x - iw / 2, n.y - iw / 2, iw, iw);
                    }
                    offCtx.fillStyle = 'rgba(255,255,255,0.72)';
                    offCtx.fillText(n.label, n.x, n.y + iw / 2 + LABEL_GAP * s);
                }

                /* ── Clip dynamic layer with mask ──────────────── */
                offCtx.globalCompositeOperation = 'destination-in';
                offCtx.drawImage(maskImg, 0, 0, w, h);

                /* ── Composite masked dynamic layer onto main ──── */
                offCtx.globalCompositeOperation = 'source-over'; // reset for next frame
                ctx.globalCompositeOperation = BLEND_MODE;
                ctx.globalAlpha = DYNAMIC_OPACITY;
                ctx.drawImage(offCvs, 0, 0);

                // Reset main context state
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;

                requestAnimationFrame(frame);
            }
        })();
    </script>
</body>

</html>
